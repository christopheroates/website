name: Build CV PDF

# Runs automatically whenever the content pages change (so the PDF is
# never more than one push out of date), and can also be run by hand
# from the Actions tab if you just want to force a rebuild.
on:
  push:
    branches: [main]
    paths:
      - "professional.html"
      - "papers.html"
      - "teaching.html"
      - "presentations.html"
      - "index.html"
      - "style.css"
      - "cv-print.css"
      - "build_cv.py"
      - "render_pdf.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build cv.html from the site pages
        run: python build_cv.py

      - name: Render cv.html to cv.pdf
        run: python render_pdf.py

      - name: Commit the updated CV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.html cv.pdf
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-update cv.html / cv.pdf from site content [skip ci]"
          git push
